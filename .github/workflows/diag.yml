name: Diagnostika Vercelu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zisti preco je nasadenie blokovane
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          A="Authorization: Bearer $VERCEL_TOKEN"
          B="https://api.vercel.com"
          {
            echo "=== POSLEDNE NASADENIA ==="
            curl -s -H "$A" "$B/v6/deployments?slug=lobseks-projects&limit=8" | jq -r '.deployments[] | "\(.readyState)  \(.url)"'
            echo ""
            echo "=== DETAIL POSLEDNEHO ==="
            LAST=$(curl -s -H "$A" "$B/v6/deployments?slug=lobseks-projects&limit=1" | jq -r '.deployments[0].url')
            echo "deployment: $LAST"
            curl -s -H "$A" "$B/v13/deployments/$LAST?slug=lobseks-projects" | jq '{readyState, readyStateReason, errorCode, errorMessage, errorStep, buildErrorAt}'
            echo ""
            echo "=== UCET ==="
            curl -s -H "$A" "$B/v2/user" | jq '.user | {username, email, version, blocked: .blocked, softBlock: .softBlock, billingPlan: .billing.plan}'
            echo ""
            echo "=== TIM ==="
            curl -s -H "$A" "$B/v2/teams" | jq '.teams[] | {slug, name, blocked: .blocked, softBlock: .softBlock, plan: .billing.plan}'
          } > diag.txt 2>&1
          cat diag.txt
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/DIAG.txt" | jq -r '.sha // empty')
          C=$(base64 -w0 diag.txt)
          if [ -n "$SHA" ]; then BODY="{\"message\":\"Diagnostika\",\"content\":\"$C\",\"sha\":\"$SHA\"}"; else BODY="{\"message\":\"Diagnostika\",\"content\":\"$C\"}"; fi
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/DIAG.txt" -d "$BODY" -o /dev/null -w "zapis: %{http_code}\n"
