name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['DEPLOY_URL.txt']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global vercel@latest

      - name: Sprístupni appku verejnosti
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X PATCH "https://api.vercel.com/v9/projects/mic-mouse?slug=lobseks-projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"ssoProtection": null, "passwordProtection": null}' -o /dev/null -w "ochrana: %{http_code}\n"

      - name: Deploy a sleduj build
        id: dep
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          URL=$(vercel deploy --prod --yes --no-wait --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" 2>/dev/null | tail -1)
          HOST=${URL#https://}
          echo "adresa: $URL"

          STATE="?"
          for i in $(seq 1 60); do
            sleep 15
            STATE=$(curl -s --max-time 20 \
              "https://api.vercel.com/v13/deployments/$HOST?slug=lobseks-projects" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('readyState','?'))" 2>/dev/null || echo "?")
            echo "$i: $STATE"
            [ "$STATE" = "READY" ] && break
            [ "$STATE" = "ERROR" ] && break
            [ "$STATE" = "CANCELED" ] && break
          done

          {
            echo "adresa nasadenia: $URL"
            echo "stabilna adresa:  https://mic-mouse-lobseks-projects.vercel.app"
            echo "stav buildu:      $STATE"
            echo "cas:              $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > vysledok.txt

          if [ "$STATE" != "READY" ]; then
            echo "" >> vysledok.txt
            echo "--- co povedal build ---" >> vysledok.txt
            vercel inspect "$URL" --logs --token "$VERCEL_TOKEN" 2>&1 | tail -c 5000 >> vysledok.txt || true
          else
            echo "" >> vysledok.txt
            echo "--- kontrola stranky ---" >> vysledok.txt
            curl -s --max-time 25 -L "https://mic-mouse-lobseks-projects.vercel.app/login" \
              | grep -o "Prihlás sa do Mic Mouse" | head -1 >> vysledok.txt || echo "(novy nadpis sa nenasiel)" >> vysledok.txt
          fi
          cat vysledok.txt

      - name: Zapis vysledok cez GitHub API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cez API, aby to nepadalo na konfliktoch v gite
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/DEPLOY_URL.txt" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          CONTENT=$(base64 -w0 vysledok.txt 2>/dev/null || base64 vysledok.txt | tr -d '\n')
          if [ -n "$SHA" ]; then EXTRA=",\"sha\":\"$SHA\""; else EXTRA=""; fi
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/DEPLOY_URL.txt" \
            -d "{\"message\":\"Vysledok nasadenia\",\"content\":\"$CONTENT\"$EXTRA}" \
            -o /dev/null -w "zapis: %{http_code}\n"
