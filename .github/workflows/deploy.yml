name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['DEPLOY_URL.txt']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          timeout 720 vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" > out.txt 2> err.txt
          CODE=$?
          set -e
          {
            echo "navratovy kod: $CODE"
            echo "--- vystup ---"
            tail -c 1500 out.txt
            echo "--- chybovy vypis (koniec) ---"
            tail -c 5000 err.txt
          } > DEPLOY_URL.txt
          cat DEPLOY_URL.txt

      - name: Zapis vysledok do repa
        if: always()
        run: |
          git config user.name "deploy bot"
          git config user.email "deploy@instaview.sk"
          git add DEPLOY_URL.txt || true
          git commit -m "Vysledok nasadenia" || exit 0
          git pull --rebase || true
          git push
