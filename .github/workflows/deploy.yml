name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['DEPLOY_URL.txt']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global vercel@latest

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --name mic-mouse \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" 2>/dev/null | tail -1)
          echo "$URL" > DEPLOY_URL.txt
          echo "Adresa: $URL"
          # Over, ze appka odpoveda (s tvrdym limitom, nech to nikdy nevisi)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -L "$URL/login" || echo "000")
          echo "odpoved /login: $CODE" >> DEPLOY_URL.txt

      - name: Zapis adresu do repa
        run: |
          git config user.name "deploy bot"
          git config user.email "deploy@instaview.sk"
          git add DEPLOY_URL.txt
          git commit -m "Deployment URL" || exit 0
          git push
