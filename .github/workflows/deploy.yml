name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['DEPLOY_URL.txt']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          URL=$(vercel deploy --prod --yes --no-wait --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --build-env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" 2>/dev/null | tail -1)
          echo "Adresa: $URL"

          # Cakaj na skutocny obsah prihlasovacej stranky, nie len na kod 200.
          # Vercel totiz vracia 200 aj pre stranku "Deployment is blocked".
          STAV="cakanie vyprsalo"
          for i in $(seq 1 40); do
            sleep 15
            BODY=$(curl -s --max-time 20 -L "$URL/login" || echo "")
            if echo "$BODY" | grep -q "Prihlás sa do Mic Mouse"; then STAV="funguje"; break; fi
            if echo "$BODY" | grep -qi "Deployment is blocked\|DEPLOYMENT_NOT_FOUND"; then STAV="build zlyhal"; break; fi
            echo "pokus $i: este sa buduje"
          done
          echo "stav: $STAV"

          {
            echo "$URL"
            echo "stav: $STAV"
            echo "cas: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > DEPLOY_URL.txt

          if [ "$STAV" != "funguje" ]; then
            echo "--- build log ---" >> DEPLOY_URL.txt
            vercel inspect "$URL" --logs --token "$VERCEL_TOKEN" 2>&1 | tail -c 6000 >> DEPLOY_URL.txt || true
          fi
          cat DEPLOY_URL.txt

      - name: Zapis vysledok do repa
        if: always()
        run: |
          git config user.name "deploy bot"
          git config user.email "deploy@instaview.sk"
          git add DEPLOY_URL.txt || true
          git commit -m "Vysledok nasadenia" || exit 0
          git pull --rebase || true
          git push
